[project]
name = "tradingsys"
version = "0.0.0"
description = "Sistema di trading su Pepperstone EU via cTrader Open API con NautilusTrader (vedi docs/PIANO.md)"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    # Versione fissata esattamente: ogni cambio richiede un ADR (ADR 0002).
    "nautilus_trader==2.0.0rc7",
    "protobuf>=5.29",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "import-linter>=2.1",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrader_async", "src/nt_ctrader", "src/riskgov", "src/tradingsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "demo: richiede credenziali e connessione al conto demo cTrader (esclusi di default con -m 'not demo')",
    "integration: test con finto server cTrader o BacktestEngine",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Simboli matematici (×, −, ·) voluti nei testi in italiano.
ignore = ["RUF001", "RUF002", "RUF003"]

# Confini fra componenti (PIANO §2.1, ADR 0001, ADR 0004). Si verificano con `uv run lint-imports`.
[tool.importlinter]
root_packages = ["ctrader_async", "nt_ctrader", "riskgov", "tradingsys"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core del rischio puro: nessuna dipendenza da Nautilus, adapter o strategie"
type = "forbidden"
source_modules = ["riskgov.core"]
forbidden_modules = ["nautilus_trader", "nt_ctrader", "ctrader_async", "tradingsys", "riskgov.nautilus"]

[[tool.importlinter.contracts]]
name = "Client cTrader indipendente da Nautilus e dal resto del sistema"
type = "forbidden"
source_modules = ["ctrader_async"]
forbidden_modules = ["nautilus_trader", "nt_ctrader", "riskgov", "tradingsys"]

[[tool.importlinter.contracts]]
name = "I segnali non toccano l'esecuzione: propongono soltanto"
type = "forbidden"
source_modules = ["tradingsys.signals"]
forbidden_modules = ["nt_ctrader", "ctrader_async", "riskgov.nautilus"]

[[tool.importlinter.contracts]]
name = "Watchdog indipendente dal nodo di trading"
type = "forbidden"
source_modules = ["tradingsys.watchdog"]
forbidden_modules = ["nautilus_trader", "nt_ctrader", "riskgov.nautilus"]
